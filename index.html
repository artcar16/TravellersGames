<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FBFAF7" />
  <meta name="description" content="The Travellers — tournois de backgammon : inscriptions, tirage, saisie des scores et arbres en direct." />
  <title>The Travellers — Backgammon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/style.css?v=7" />

  <!-- Icônes : onglet, écran d'accueil iPhone, installation Android -->
  <link rel="icon" href="/favicon.ico?v=7" sizes="48x48" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=7" />
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png?v=7" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=7" />
  <link rel="manifest" href="/manifest.webmanifest?v=7" />

  <!-- Écran d'accueil iPhone : s'ouvre comme une app, sans la barre de Safari -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Travellers" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="application-name" content="Travellers" />

  <!-- Aperçu du lien partagé (WhatsApp, iMessage…) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="The Travellers — Backgammon" />
  <meta property="og:description" content="Tournois du club : tirage, scores en direct et tableaux." />
  <meta property="og:image" content="https://travellers-games.vercel.app/icons/og-1200x630.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
</head>
<body>
  <header class="topbar" id="topbar">
    <a class="brand" href="#/">
      <img src="icons/icon-192.png?v=7" alt="" class="brand-logo" />
      <span class="brand-name">The&nbsp;Travellers</span>
    </a>
    <button class="status-dot" id="sync-pill" type="button" title="État de la base de données partagée">
      <span class="dot"></span><span id="sync-label" class="status-label">Local</span>
    </button>
  </header>

  <main id="app" class="app"></main>

  <footer class="footer" id="footer">
    <span>The Travellers · Paris</span>
  </footer>

  <div id="modal-root"></div>

  <noscript><p style="padding:20px;text-align:center">Cette application nécessite JavaScript.</p></noscript>

  <script src="js/store.js?v=7"></script>
  <script src="js/cloud.js?v=7"></script>
  <script src="js/app.js?v=7"></script>
</body>
</html>
